# ============================================================
#  Haven — анти-гриф (контейнер-лок + trust + репутация)
# ============================================================

prefix: "&8[&bHaven&8] &r"

# Язык сообщений игрокам: ru | en. Тексты — в messages_<язык>.yml (создаётся при старте).
# Админ-команды и диагностика остаются на русском (технические). /hv reload применяет смену.
language: ru

# Подробные логи в консоль (что заблокировано/разрешено/нейтрализовано). Для отладки.
# Можно переключать на лету: /hv debug on|off
debug: false

protection:
  # Крипер/TNT/взрывы НЕ ломают блоки (рекомендовано для build-сервера).
  block-explosion-damage: true
  # Огонь не распространяется и не сжигает блоки.
  prevent-fire-spread: true
  # Лава/вода не зальёт защищённые контейнеры.
  protect-from-liquids: true
  # Поршни не двигают защищённые блоки (анти-десинк ownership по координате).
  prevent-piston-move: true
  # Защищать ВСЕ поставленные игроками блоки (постройки), а не только контейнеры.
  # Природные блоки/руда/деревья остаются без владельца — их можно копать свободно.
  protect-blocks: true
  # Защищать сущности игрока: рамки, картины, армор-стенды, лодки, вагонетки.
  # Кататься на чужой лодке/вагонетке можно — нельзя ломать и трогать содержимое.
  protect-entities: true

# Какие блоки защищаются по владельцу (кто поставил — тот владелец).
# Все варианты *_SHULKER_BOX добавляются автоматически.
containers:
  - CHEST
  - TRAPPED_CHEST
  - BARREL
  - FURNACE
  - BLAST_FURNACE
  - SMOKER
  - DISPENSER
  - DROPPER
  - HOPPER
  - BREWING_STAND

# Репутация = base + (часы игры * per-hour) + (число жалоб * per-incident)
reputation:
  base: 0
  per-hour: 10
  per-incident: -25
  min: -100
  max: 1000
  staff: 9999
  griefer-threshold: -50      # rep <= этого  → ГРИФЕР
  trusted-threshold: 100      # rep >= этого  → Свой

# Текст тега для плейсхолдера %haven_tag% (вставляется в TAB).
tags:
  griefer: "&c⚠ ГРИФЕР"
  trusted: "&a★ Свой"
  neutral: ""                 # нейтральные/новички — без тега
  staff: "&b✦ АДМИН"

cooldowns:
  notify-seconds: 30          # как часто слать владельцу «X пытался влезть»
  report-seconds: 60          # анти-спам жалоб (на пару репортер→цель)

# Гейт для новичков: опасные механики закрыты, пока не наиграно required-hours
# активного времени. Проверка остатка — командой /access. Обходят: стафф, bypass, верифицированные.
playtime-gate:
  enabled: true
  required-hours: 8
  # Anti-AFK для playtime: если игрок не двигался/не строил/не взаимодействовал столько минут —
  # наигрыш НЕ растёт (защита от AFK-пулов / автокликера, который накручивает гейт и credible-вес
  # жалоб). 0 = выключить (старое поведение — playtime растёт пока в сети).
  afk-timeout-minutes: 5
  blocked-items:
    - LAVA_BUCKET
    - FLINT_AND_STEEL
    - FIRE_CHARGE
    - TNT
    - TNT_MINECART
    - HOPPER
    - HOPPER_MINECART
    - DISPENSER
    - DROPPER
    - RESPAWN_ANCHOR

# Авто-санкции по репутации + взвешивание жалоб.
sanctions:
  enabled: true
  restrict-below: -50               # rep <= → опасные механики авто-ограничены (как у новичка)
  flag-below: -100                  # rep <= → крит-пинг онлайн-админам при новой жалобе
  min-reporter-playtime-hours: 1    # жалоба влияет на рейтинг только от репортёра с таким playtime
  # Дневной лимит жалоб от ОДНОГО репортёра (анти-репорт-спам альтами). 0 = выключено.
  # Стафф, bypass, verified — без лимита. Окно скользящее: каждая жалоба «сгорает» через 24ч.
  max-reports-per-day: 5
  # Подтверждение жалобы N независимыми credible-репортёрами (анти-абьюз репортов альтами).
  # При достижении N разных репортёров на одного игрока в окне — отдельный громкий
  # алерт онлайн-админам [ПОДТВЕРЖДЕНО]. Сами жалобы продолжают копить рейтинг как обычно —
  # это лишь более громкий сигнал «уже не один человек жалуется».
  # 0 или 1 = выключить отдельный алерт.
  confirm-from-reporters: 2
  confirm-window-hours: 24

# ============================================================
#  Оффлайн-сводка вторжений — «пока тебя не было, Steve трогал твоё».
#  Пока владелец оффлайн, попытки сломать/открыть его блоки копятся (агрегатом:
#  одна строка на игрока+действие, не поблочно). На входе он видит сводку, и она
#  очищается. Непросмотренные записи живут ttl-hours и удаляются — если игрок не
#  заходит сутки, старое не копится вечно.
# ============================================================
offline-summary:
  enabled: true
  ttl-hours: 24                 # непросмотренные записи старше — удаляются
  max-entries-shown: 20         # сколько строк показать на входе
  max-pending-events: 5000      # in-memory кэп (анти-DoS при массовом рейде альтами)

# ============================================================
#  Decay заброшенных построек — здоровье мира против вечных «гост-баз».
#  Если владелец не заходит N дней — защита его построек СНИМАЕТСЯ (soft decay):
#  любой может ломать/открывать. UUID на блоках остаётся — как только владелец
#  вернётся (зайдёт на сервер), защита восстанавливается мгновенно (если блоки
#  ещё целы). По умолчанию ВЫКЛЮЧЕНО — включай осознанно.
#
#  Слабые места, которые уже учтены:
#   - Долгий рестарт сервера НЕ разблокирует базы массово: grace-after-startup-minutes
#     даёт игрокам время зайти и обновить таймер после старта.
#   - Существующие игроки (до апгрейда) с неизвестным last_login НЕ decay'ятся,
#     пока не зайдут хотя бы раз (безопасный грейс).
#   - staff и bypass по умолчанию НЕ decay'ятся (их базы вечны).
# ============================================================
decay:
  enabled: false                      # ВЫКЛ по умолчанию
  soft-days-inactive: 30              # нет входа N дней → защита снимается
  grace-on-install-days: 30           # (резерв) грейс для игроков без известного last_login
  grace-after-startup-minutes: 60     # после старта сервера decay не применяется столько минут
  recompute-interval-minutes: 5       # период пересчёта кэша заброшенных (не на hot-path)
  staff-exempt: true                  # staff-список не decay'ится никогда
  bypass-exempt: true                 # /hv bypass игроки тоже защищены от decay

# ============================================================
#  PvP: логирование убийств + кнопки жертве «согласованный бой / нападение».
#  Сам PvP остаётся ванильным (мы не отменяем удары). После смерти жертве в чат приходит
#  inquiry с двумя кнопками:
#    [✓ Был бой]     — рейтинг убийцы не меняется (взаимная драка)
#    [✖ Нападение]  — создаётся инцидент (как через /report), рейтинг убийцы падает
#  Стафф + игроки с правом haven.pvp.bypass не дёргают inquiry.
# ============================================================
pvp:
  enabled: true                          # включить PvP-inquiry
  log-kills: true                        # писать в консоль каждое PvP-убийство (для аудита)
  inquiry-window-seconds: 300            # сколько живёт кнопка (5 мин). После — ответить нельзя
  # Анти-спам: одна inquiry на пару (killer, victim) в окне. По умолчанию = окну ответа (5 мин),
  # т.е. если пропустил кнопку — следующая смерть через 5+ мин даст новую. После УСПЕШНОГО
  # ответа (accept/complain) cooldown сбрасывается — следующая смерть сразу даст новую кнопку.
  inquiry-cooldown-seconds: 300
  notify-killer-on-complain: true        # сообщить убийце что жертва пожаловалась
  complain-weight: 1                     # вес incident'а при complain (как у обычного /report)

# ============================================================
#  Discord webhook (опционально) — для алертов [ПОДТВЕРЖДЕНО], чтобы админ
#  узнавал о подтверждённом грифе даже когда не в игре. Пусто = выключено.
#
#  Как настроить:
#   1) Discord → Настройки сервера → Интеграции → Вебхуки → «Создать вебхук»,
#      выбери канал, скопируй URL в webhook-url.
#   2) Чтобы пинговать роль модераторов: правый клик по роли с включённым
#      «Режим разработчика» → «Скопировать ID» → вставь в mention-role-id.
#  Безопасность: allowed_mentions защищает от @everyone-абьюза через ник игрока.
#  Отправка асинхронная, любая ошибка (DNS/timeout/HTTP) — варнинг в лог, плагин не падает.
# ============================================================
discord:
  webhook-url: ""           # https://discord.com/api/webhooks/...   (пусто = выключено)
  mention-role-id: ""       # 123456789012345678 — пинг при [ПОДТВЕРЖДЕНО]; пусто = без пинга

# ============================================================
#  Приветствие новичка: чат-гайд + нативное Dialog-окно с рассказом о фишках.
#  Окно/гайд открывается при первом входе и по команде /haven help.
#  use-dialog требует ядро Paper с Dialog API (1.21.6+); если оно недоступно —
#  плагин сам откатится на чат-гайд (без ошибок).
# ============================================================
welcome:
  enabled: true             # полностью включить/выключить приветствие (false = ничего не показывать)
  show-on-first-join: true  # авто-показ при самом первом входе игрока
  use-dialog: true          # true = нативное Dialog-окно; false = только текстовый гайд в чат

# ============================================================
#  CoreProtect (опционально) — к каждому /report автоматически прикладывается
#  снимок последних действий нарушителя вокруг точки репорта. Смотреть: /hv evidence <id>.
#  Требует установленного CoreProtect (softdep). Без него инцидент создаётся без доказательств.
#  Подключение через reflection — сборка/работа плагина не зависит от наличия CoreProtect.
#  Лукап координат берётся от позиции РЕПОРТЁРА в момент /report (может отличаться от места
#  грифа, если репортят издалека — это указано в самом снимке).
# ============================================================
coreprotect:
  enabled: true
  lookup-radius-blocks: 50      # радиус поиска вокруг точки репорта
  lookup-window-minutes: 30     # за сколько минут до репорта смотреть действия
  max-snippet-lines: 50         # сколько строк сохранять максимум
  min-api-version: 8            # минимальная версия CoreProtect API (8 = CP 22+)

# ============================================================
#  Состав администрации — ПОЛНЫЙ ИММУНИТЕТ к системе.
#  Их нельзя репортить/понижать им rep, они имеют доступ ко всему,
#  rep всегда максимум, тег ✦ АДМИН. Список по нику (резолвится в UUID
#  при входе игрока). Альтернатива — право haven.staff (LuckPerms).
# ============================================================
staff:
  - PlayerA      # админ (владелец)
  - PlayerB      # менеджер
  - PlayerC      # модератор

# ============================================================
#  Storage backend.
#
#  По умолчанию: SQLite (embedded, ноль настроек). Подходит для подавляющего большинства
#  серверов: WAL+NORMAL+mmap=256MB, пакетная write-behind на single writer-треде.
#  В таком режиме TrustGuard не блокирует main даже на 50–200 онлайн с активной застройкой.
#
#  Когда менять на MySQL/MariaDB:
#   - размер haven.db перевалил за 5–10 ГБ (несколько лет активного билдинга);
#   - нужна шара БД с другим плагином/веб-панелью/бэкап-сервером;
#   - сетевая БД уже есть и хочется единого бэкапа.
#
#  Миграция: /hv migrate-storage mysql — перенос всех данных одним пакетом
#  (после смены storage.type и /hv reload, либо после рестарта).
# ============================================================
storage:
  # sqlite | mysql | mariadb
  type: sqlite

  # Параметры только для type: mysql|mariadb (для sqlite игнорируются).
  mysql:
    host: localhost
    port: 3306
    database: haven
    user: haven
    password: ""
    # Доп.JDBC-параметры через & (по умолчанию уже включены: rewriteBatchedStatements,
    # cachePrepStmts, useServerPrepStmts, prepStmtCacheSize=250 — менять без причины не нужно).
    extra-params: ""
    use-ssl: false
    # HikariCP — дефолты сняты с LuckPerms (battle-tested). Менять только если знаешь зачем.
    pool:
      maximum-pool-size: 10
      minimum-idle: 10
      connection-timeout-ms: 5000     # main никогда не блокируется > 5с на соединении
      maximum-lifetime-ms: 1800000    # 30 мин; должен быть < MySQL wait_timeout (28800с default)
