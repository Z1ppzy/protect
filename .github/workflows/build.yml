name: Build

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

# Пуш за пушем: новый прогон отменяет предыдущий, чтобы в dev не уехала сборка постарее.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # пересоздаём тег и релиз dev
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test
        run: mvn -B -ntp clean package

      - name: Найти собранный jar
        id: jar
        run: |
          jar=$(find target -maxdepth 1 -name 'Haven-*.jar' | head -n1)
          [ -n "$jar" ] || { echo "::error::target/Haven-*.jar не собрался"; exit 1; }
          name=$(basename "$jar")
          version=${name#Haven-}
          version=${version%.jar}
          echo "path=$jar" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "### $name" >> "$GITHUB_STEP_SUMMARY"

      # У PR своего релиза нет — кладём jar во временный артефакт прогона.
      - name: Артефакт для PR
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: Haven-${{ steps.jar.outputs.version }}
          path: ${{ steps.jar.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      # Один и тот же тег dev: старый релиз сносим вместе с тегом, новый встаёт на его место.
      # В разделе Releases всегда ровно одна свежая сборка с main — ничего не копится.
      - name: Обновить dev-сборку
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          JAR: ${{ steps.jar.outputs.path }}
          VERSION: ${{ steps.jar.outputs.version }}
        run: |
          subject=$(git log -1 --pretty=%s)
          cat > notes.md <<EOF
          Автосборка последнего коммита в \`main\`. Обновляется на каждый пуш, файл здесь всегда один.

          - **Версия:** \`$VERSION\`
          - **Коммит:** [\`${GITHUB_SHA:0:7}\`]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/commit/$GITHUB_SHA) — $subject
          - **Собрано:** $(date -u '+%d.%m.%Y %H:%M UTC')

          Для боевого сервера лучше брать релиз с тегом \`v*\` — dev-сборка может быть сырой.
          EOF
          if gh release view dev >/dev/null 2>&1; then
            gh release delete dev --cleanup-tag --yes
          fi
          gh release create dev "$JAR" \
            --target "$GITHUB_SHA" \
            --title "Dev $VERSION" \
            --notes-file notes.md \
            --prerelease
