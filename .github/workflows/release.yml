name: Release

on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # публикуем релиз с jar
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Build & test
        run: mvn -B -ntp clean package

      - name: Опубликовать релиз
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          jar=$(find target -maxdepth 1 -name 'Haven-*.jar' | head -n1)
          [ -n "$jar" ] || { echo "::error::target/Haven-*.jar не собрался"; exit 1; }
          # Релиз мог быть заведён руками до пуша тега — тогда просто подменяем в нём jar.
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "$jar" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "$jar" \
              --title "$GITHUB_REF_NAME" \
              --generate-notes \
              --verify-tag
          fi
